<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koios | Inovação e Praticidade</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://kit.fontawesome.com/a2c2f1f52a.js" crossorigin="anonymous"></script>
  <style>
    :root {
      color-scheme: dark light;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      transition: background 0.3s, color 0.3s;
    }

    header {
      background: linear-gradient(90deg, #2c3e50, #4ca1af);
      padding: 2rem;
      text-align: center;
    }

    .logo {
      width: 160px;
      max-width: 100%;
      margin-bottom: 1rem;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      justify-content: center;
      background: #1a1a1a;
      padding: 1rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    nav a {
      color: #f5f5f5;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    nav a:hover {
      color: #4ca1af;
    }

    section {
      max-width: 900px;
      margin: auto;
      padding: 2rem;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      pointer-events: none;
      position: absolute;
      width: 100%;
    }

    section.fade-in {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
      position: relative;
    }

    section.fade-out {
      opacity: 0;
      transform: translateY(30px);
      pointer-events: none;
      position: absolute;
    }

    h2 {
      color: #4ca1af;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    footer {
      background: #111;
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
      color: #aaa;
    }

    .highlight {
      color: #4ca1af;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 1.8rem;
      }

      nav {
        flex-direction: column;
        align-items: center;
      }

      section {
        padding: 1rem;
      }

      h2 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <img src="3af201b4-3d54-4005-ae2c-67c0eeb9eebe.png" alt="Logo da Koios" class="logo">
      <h1>{{ nomeEmpresa }}</h1>
      <p>{{ slogan }}</p>
    </header>

    <nav>
      <a @click="trocarPaginaManual('sobre')"><i class="fas fa-info-circle"></i> Sobre</a>
      <a @click="trocarPaginaManual('valores')"><i class="fas fa-bullseye"></i> Valores</a>
      <a @click="trocarPaginaManual('projetos')"><i class="fas fa-boxes"></i> Projetos</a>
      <a @click="trocarPaginaManual('privacidade')"><i class="fas fa-user-shield"></i> Privacidade</a>
      <a @click="trocarPaginaManual('contato')"><i class="fas fa-envelope"></i> Contato</a>
    </nav>
